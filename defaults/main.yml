---
nix_user: 'admin'
nix_version: '3.22.5'
nix_installer_url: 'https://github.com/DeterminateSystems/nix-installer/releases/download/v{{ nix_version }}/nix-installer-{{ nix_arch }}-{{ nix_platform }}'
nix_installer_path: '/tmp/nix-installer-{{ nix_version }}-{{ nix_arch }}-{{ nix_platform }}'
nix_custom_conf_path: '/etc/nix/nix.custom.conf'
nix_ansible_conf_path: '/etc/nix/nix.ansible.conf'
# Used by nix-darwin's nixbld user configuration.
nix_first_build_uid: 30000

# Use to force purge nix, useful when installation is broken.
nix_force_purge: false

# Allow enabling experimental features.
nix_experimental_features: []

# Cache
nix_settings:
  'experimental-features': '{{ nix_experimental_features | join(" ") }}'
  'download-buffer-size': '{{ 256 * 1024 * 1024 }}' # 256 MB
  'extra-substituters': 'https://nix-cache.status.im/'
  'extra-trusted-public-keys': 'nix-cache.status.im-1:x/93lOfLU+duPplwMSBR+OlY4+mo+dCN7n0mr4oPwgY='

# Additional settings which override defaults from nix_settings.
nix_extra_settings: {}

# Tokens for authenticated fetches from Git forges like GitHub.
# Kept in a separate file included from nix.conf so they stay out of the Nix store on Darwin.
nix_access_tokens: {}
#  'github.com': 'ghp_...'
nix_access_tokens_file: '/etc/nix/access-tokens.conf'

nix_additional_inputs: {}
#  unstable: 'github:NixOS/nixpkgs/commit-rev'

# DS Nix built-in garbage collector strategy
nix_garbage_collector_strategy: 'automatic' # or 'disabled'

# Only used by nix-darwin
nix_darwin_pkgs_rev: '98bf8103e311377ca1d648c22f56332756d89bb2' #nixpkgs-25.11-darwin
nix_darwin_flake_rev: 'ebec37af18215214173c98cf6356d0aca24a2585' #nix-darwin-25.11
nix_darwin_nbs_rev: 'a46d8b5e3c30a8a822225e9a81c19e63d159c2b2' #nimbus-build-system master, Nim 2.2.12
nix_darwin_nbs_nimble_rev: '33a6bc8e50a33222fce075143800fe5a715e8bfe' #nimble 0.26.0
nix_darwin_bin_path: '/run/current-system/sw/bin'
# Use to force apply nix darwin configuration switch even when config is unchanged.
nix_darwin_force_apply: false
nix_darwin_default_packages:
  - jq
  - fzf
  - wget
  - htop
  - silver-searcher
  - coreutils
  - watch
  - tree
  - gnutar
  - unzip
  - mtr
  - zsh-completions
  - zsh-history-substring-search
  - zsh-syntax-highlighting
  - wireguard-tools
  - wireguard-go
  - netdata
  - mtr
  - mtr-exporter
  - chrony
  - xcodes
  - nim-nbs

nix_darwin_packages_no_check:
  - chrony

nix_darwin_extra_packages: []

nix_darwin_packages: '{{ nix_darwin_default_packages + nix_darwin_extra_packages }}'
