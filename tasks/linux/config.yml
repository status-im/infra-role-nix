---
- name: Raise open files system limit
  notify: Restart nix-daemon
  sysctl:
    sysctl_file: '/etc/sysctl.d/88-ansible.conf'
    name:  'fs.file-max'
    value: '1048576'
    state: 'present'

- name: Create Nix config file
  notify: Restart nix-daemon
  template:
    src:   'nix.ansible.conf.j2'
    dest:  '{{ nix_ansible_conf_path }}'
    owner: 'root'
    group: 'root'
    mode:  '0o644'

- name: Create Nix access tokens file
  template:
    src:   'access-tokens.conf.j2'
    dest:  '{{ nix_access_tokens_file }}'
    owner: 'root'
    group: 'root'
    mode:  '0o644'

- name: Include Nix access and config files
  notify: Restart nix-daemon
  lineinfile:
    path: '{{ nix_custom_conf_path }}'
    line: '!include {{ item }}'
  with_items:
    - '{{ nix_access_tokens_file }}'
    - '{{ nix_ansible_conf_path }}'

- name: Create Determinate Nix config dir
  file:
    path:  '/etc/determinate'
    owner: 'root'
    group: 'root'
    mode:  '0o755'
    state: 'directory'

- name: Disable Determinate Nix Sentry telemetry
  notify: Restart nix-daemon
  template:
    src:   'determinate-config.json.j2'
    dest:  '/etc/determinate/config.json'
    owner: 'root'
    group: 'root'
    mode:  '0o644'
