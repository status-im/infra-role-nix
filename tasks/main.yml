---
- name: Load platform dependent installer info
  include_vars: '{{ ansible_os_family }}/{{ ansible_machine }}.yml'

- name: Run Nix purge script
  when: nix_force_purge | bool
  script: files/purge.sh

- import_tasks: 'version.yml'

- include_tasks: 'install.yml'
  when:
    - nix_current_version is not defined or not (nix_is_determinate | default(false))

- include_tasks: 'upgrade.yml'
  when:
    - nix_current_version is defined
    - nix_current_version != nix_version

- include_tasks: '{{ ansible_system | lower }}/config.yml'

- include_tasks: '{{ ansible_system | lower }}/cleanup.yml'

- name: Cleanup after installation
  file:
    path: '{{ nix_installer_path }}'
    state: absent
  no_log: true
