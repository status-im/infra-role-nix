---
- name: Check conflicting /etc files before nix-darwin
  stat:
    path: '{{ item }}'
  loop:
    - /etc/bashrc
    - /etc/zprofile
    - /etc/zshenv
    - /etc/zshrc
  register: nix_darwin_etc_files

- name: Back up files conflicting with nix-darwin
  command:
    argv:
      - 'mv'
      - '{{ item.stat.path }}'
      - '{{ item.stat.path }}.before-nix-darwin'
    creates: '{{ item.stat.path }}.before-nix-darwin'
  when:
    - item.stat.exists
    - not item.stat.islnk
  loop: '{{ nix_darwin_etc_files.results }}'
  loop_control:
    label: '{{ item.stat.path }}'
  become: true

- name: Setup nix-darwin directories
  file:
    path:  '/etc/nix-darwin'
    state: 'directory'
    owner: '{{ nix_user }}'
    mode:  '0o755'
  become: true

- name: Deploy nix-darwin configuration
  template:
    src:   '{{ item }}.j2'
    dest:  '/etc/nix-darwin/{{ item }}'
    owner: 'root'
    group: 'wheel'
    mode:  '0o640'
  loop:
    - flake.nix
    - configuration.nix
  register: nix_darwin_config

# Enable flakes for the initial switch before nix-darwin applies the configuration.
- name: Apply nix-darwin switch
  when: nix_darwin_config.changed or nix_darwin_force_apply | default(false)
  become: true
  environment:
    HOMEBREW_NO_ASK: '1'
  shell: |
    /nix/var/nix/profiles/default/bin/nix \
      --extra-experimental-features 'nix-command flakes' \
      run nix-darwin/master#darwin-rebuild -- \
      switch --flake /etc/nix-darwin
