---
- name: Check conflicting /etc files before nix-darwin
  stat:
    path: "{{ item }}"
  loop:
    - /etc/bashrc
    - /etc/zshrc
    - /etc/zprofile
  register: etc_files
  become: true

- name: Check existing .before-nix-darwin backups
  stat:
    path: "{{ item }}.before-nix-darwin"
  loop:
    - /etc/bashrc
    - /etc/zshrc
    - /etc/zprofile
  register: etc_backups
  become: true

- name: Back up conflicting /etc files for nix-darwin
  when:
    - item.0.stat.exists
    - not item.0.stat.islnk
    - not item.1.stat.exists
  command: mv {{ item.0.stat.path }} {{ item.0.stat.path }}.before-nix-darwin
  loop: "{{ etc_files.results | zip(etc_backups.results) | list }}"
  become: true

- name: Setup nix-darwin directories
  file:
    path: /etc/nix-darwin
    state: directory
    owner: "{{ nix_user }}"
    mode: '0755'
  become: true

- name: Create Nix access tokens file
  template:
    src:   'access-tokens.conf.j2'
    dest:  '{{ nix_access_tokens_file }}'
    owner: 'root'
    group: 'wheel'
    mode:  '0644'
  become: true

- name: Deploy nix-darwin configuration
  template:
    src: "{{ item }}.j2"
    dest: "/etc/nix-darwin/{{ item }}"
  loop:
    - flake.nix
    - configuration.nix
  register: nix_darwin_config

# Enable flakes for the initial switch before nix-darwin applies the configuration.
- name: Apply nix-darwin switch
  when: nix_darwin_config.changed or nix_force_apply | default(false)
  become: true
  environment:
    HOMEBREW_NO_ASK: '1'
  shell: |
    /nix/var/nix/profiles/default/bin/nix \
      --extra-experimental-features 'nix-command flakes' \
      run nix-darwin/master#darwin-rebuild -- \
      switch --flake /etc/nix-darwin

- name: Include Nix access tokens in Determinate custom configuration
  lineinfile:
    path: /etc/nix/nix.custom.conf
    regexp: '^!include '
    line: '!include {{ nix_access_tokens_file }}'
  become: true
  notify: restart nix-daemon
